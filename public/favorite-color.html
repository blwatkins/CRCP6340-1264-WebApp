<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180"
          href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32"
          href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16"
          href="/favicon-16x16.png" />
    <link rel="manifest"
          href="/site.webmanifest" />
    <meta name="author"
          content="Brittni Watkins"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" />
    <link id="fa-stylesheet"
          rel="stylesheet" crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.1/css/all.min.css"
          integrity="sha384-rWj9FmWWt3OMqd9vBkWRhFavvVUYalYqGPoMdL1brs/qvvqz88gvLShYa4hKNyqb" />
    <link rel="stylesheet"
          href="/css/main.css"/>
    <title>What is Your Favorite Color?</title>
    <meta name="description"
          content="What is your favorite color? Fill out the form and let me know." />
</head>
<body class="min-vh-100 d-flex flex-column">
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand"
               href="/">
                Brittni's Summer 2026 NFTs
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbar-navigation"
                    aria-controls="navbar-navigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="navbar-navigation"
                 class="collapse navbar-collapse" >
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="/#about">
                            About
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active"
                           href="/favorite-color.html"
                           aria-current="page">
                            Favorite Color
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light"
                                disabled>
                            Connect Wallet
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<main class="container flex-grow-1 d-flex flex-column justify-content-start justify-content-md-center">
    <div class="w-100">
        <div class="row g-4 m-2">
            <div class="col-12 text-center">
                <h1 class="heading">What is your favorite color?</h1>
            </div>
        </div>
        <div class="row align-items-center g-4 m-2">
            <div class="col-12 col-md-6">
                <form id="favorite-color-form" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label"
                               for="name-input">Name</label>
                        <input id="name-input"
                               class="form-control disable-toggle"
                               type="text" name="name" placeholder="John Doe" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"
                               for="color-input">Favorite Color</label>
                        <input id="color-input"
                               class="form-control disable-toggle"
                               type="text" name="color" maxlength="7" placeholder="#000000" required />
                    </div>
                    <div class="mb-3">
                        <button id="submit-button"
                                class="btn btn-success w-100 disable-toggle"
                                type="submit">
                            Submit
                        </button>
                    </div>
                </form>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-center">
                <div id="color-preview-div"
                     class="mx-auto rounded-4 color-preview"
                     style="background:black;" >
                    &nbsp;
                </div>
            </div>
        </div>
    </div>
</main>
<footer>
    <nav class="navbar mt-auto navbar-dark bg-dark">
        <div class="container-fluid d-flex flex-column flex-md-row justify-content-center justify-content-md-between align-items-center gap-2">
      <span class="navbar-text mb-0">
        Copyright &copy; 2026 Brittni Watkins.
      </span>
            <ul class="list-unstyled d-flex gap-2 mb-0">
                <li>
                    <a class="text-light"
                       href="https://github.com/blwatkins"
                       aria-label="GitHub profile">
                        <i class="fa-brands fa-github fa-lg"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</footer>
<script crossorigin="anonymous"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI">
</script>
<script src="/dist/bundle.js"></script>
</body>
</html>
